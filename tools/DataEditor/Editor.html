<!-- Assembled by build.mjs; modules are inlined because Apps Script has no .js file type. -->
<style>
  /* Both schemes are declared, so the UA styles form controls and BUTTONS for the scheme in
     force. Without it a button keeps `buttontext` (black) whatever `color` the page sets on its
     ancestors — buttons do not inherit colour — and the record list turns black-on-charcoal in
     dark mode. Every colour below is then stated in both schemes rather than half-flipped. */
  :root { color-scheme: light dark; }

  body { font: 13px/1.5 -apple-system, system-ui, sans-serif; margin: 0; color: #222; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px; flex-wrap: wrap;
           border-bottom: 1px solid #ddd; position: sticky; top: 0; background: #fff; z-index: 5; }
  main { display: grid; grid-template-columns: 200px 1fr 400px; gap: 12px; padding: 12px; }

  /* A Sheets sidebar (Code.gs showSidebar) is about 300px wide, and the three-column grid needs
     456px before the form column gets a single pixel. One of the two shipped entry points is
     that sidebar, so the narrow layout is not a nicety. */
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
    #records { max-height: 30vh; }
    .field { grid-template-columns: 1fr; }
    .error { grid-column: 1; }
  }

  #records { display: flex; flex-direction: column; gap: 2px; max-height: 80vh; overflow: auto; }
  .record { text-align: left; padding: 4px 6px; border: 1px solid #eee; background: #fafafa;
            color: #222; cursor: pointer; }
  section { border: 1px solid #eee; padding: 8px; margin-bottom: 10px; }
  section h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; color: #666; }
  .field { display: grid; grid-template-columns: 160px 1fr; gap: 6px; align-items: center;
           margin-bottom: 4px; }
  .field label { color: #444; font-family: ui-monospace, monospace; font-size: 11px; }
  input, select { padding: 3px 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }

  /* .error is sized and placed for a form field. The header status line reuses the class for
     its colour alone, so it opts back out of both. */
  .error { color: #b00; font-size: 11px; grid-column: 2; }
  #status { font-size: 12px; }
  #status.error { grid-column: auto; font-size: 12px; }

  .warn { background: #fff6d8; border: 1px solid #e8cf7a; color: #4a3c00; padding: 6px;
          margin-bottom: 10px; }
  .ok { color: #060; }
  .problem { font-size: 11px; border-bottom: 1px solid #eee; padding: 2px 0; }
  #publish-results { max-height: 60vh; overflow: auto; }
  canvas.preview, canvas.appearance, canvas.effect { image-rendering: pixelated;
    border: 1px solid #eee; background: repeating-conic-gradient(#f4f4f4 0% 25%, #fff 0% 50%)
    50% / 12px 12px; }
  /* A 384px character canvas in a ~300px Sheets sidebar shrinks rather than overflowing. */
  #previews canvas { max-width: 100%; height: auto; }
  .picker { position: relative; }
  .results { position: absolute; z-index: 10; background: #fff; border: 1px solid #ccc;
             max-height: 200px; overflow: auto; width: 100%; }
  .result { display: block; width: 100%; text-align: left; border: 0; background: none;
            color: #222; padding: 3px 6px; cursor: pointer; }
  /* The arrow-key cursor in the FK picker. Focus stays on the input (aria-activedescendant), so
     :focus and :hover never mark the current row — this class is the only thing that does. */
  .result.active { background: #dde9ff; }
  .resolved { font-size: 11px; color: #555; }
  .resolved.bad { color: #b00; }

  /* Emitted by pickers.js and composites.js. Without rules of their own these inherit body text,
     which for .unsupported — the marker for a composite kind this build cannot render — reads as
     an ordinary field rather than as something to report. */
  .status { font-size: 11px; color: #555; }
  .status.bad { color: #b00; }
  .hint { font-size: 11px; color: #666; margin-bottom: 2px; }
  .readout { font-size: 11px; color: #555; margin-left: 4px; }
  /* The tint field's label names the field, not a column, so the slider carries the name of the
     cell it moves. */
  .blend-label { font-size: 11px; color: #555; margin-left: 6px; }
  .graphic, .bitmask, .idlist, .rgba, .equip { display: block; }
  .graphic canvas, .equip canvas { vertical-align: middle; }
  .unsupported { border: 1px dashed #b00; padding: 4px; }

  .chip { display: inline-flex; gap: 4px; background: #eef; border: 1px solid #ccd;
          color: #222; padding: 1px 4px; margin: 1px; }
  .chip .remove { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 2px; }
  .equip-slot { display: grid; grid-template-columns: 60px 1fr 44px auto; gap: 4px;
                align-items: center; }
  .check { display: block; font-size: 11px; }
  .check input { width: auto; margin-right: 4px; }

  /* The tri-state Bool control. `input { width: 100% }` above is written for text fields and
     would stretch the checkbox across the whole row, so it is overridden HERE BY TYPE rather
     than for the wrapper: a Bool cell holding something other than 0/1 falls back to a plain
     text input inside this same span, and that one still wants to fill the row. (It gets most
     of it rather than all of it — inside this flex container the 100% is a basis that shrinks
     to leave room for the "not a 0/1 value" status beside it.) */
  .boolean { display: flex; gap: 6px; align-items: center; }
  .boolean input[type="checkbox"] { width: auto; margin: 0; }
  .boolean .clear { border: 0; background: none; color: #555; cursor: pointer; padding: 0 2px; }

  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1c; color: #eee; }
    header, section, .record, .result, .results { background: #242424; border-color: #3a3a3a; }
    input, select { background: #2c2c2c; color: #eee; border-color: #444; }
    section h3, .field label, .resolved, .status, .hint, .readout, .blend-label,
    .boolean .clear { color: #aaa; }
    /* Buttons do not inherit colour, so both of these are stated, not left to the cascade. */
    .record, .result { color: #eee; }
    .result.active { background: #33415c; }
    .chip { background: #2b2b3a; border-color: #43435a; color: #eee; }
    /* #060 and #b00 sit at roughly 1.7:1 and 2.5:1 on #1c1c1c, against a 4.5:1 target — and
       .error carries every validation message there is. */
    .ok { color: #6ede8a; }
    .error, .resolved.bad, .status.bad { color: #ff8f80; }
    .warn { background: #3a3218; border-color: #6b5c22; color: #f3e6b8; }
    .problem { border-bottom-color: #333; }
    canvas.preview, canvas.appearance, canvas.effect { border-color: #3a3a3a;
      background: repeating-conic-gradient(#2a2a2a 0% 25%, #202020 0% 50%) 50% / 12px 12px; }
    .unsupported { border-color: #ff8f80; }
  }
</style>
